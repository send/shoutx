name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - .gitattributes
      - .github/scripts/install-shoutx.sh
      - .github/workflows/release.yml
      - scripts/verify-stable-docs.sh
      - tools/archive-validator/**
      - src/**
      - tests/fixtures/stable-help.txt
      - tests/cli_contract.rs
      - tests/stable_surface.rs
      - scripts/check-stdout-release.py
      - scripts/publish-release.py
      - scripts/verify-stdout-run.py
      - tests/workflow-smoke/test_stdout_release.py
      - tests/workflow-smoke/test_release_publish.py
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          if [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rust toolchain must be one exact stable version" >&2
            exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal \
            --component clippy --component rustfmt
          printf 'TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
      - name: Verify source contract with both providers
        run: |
          scripts/verify-stable-docs.sh
          SHOUTX_EXPECT_SURFACE=stable CARGO_TARGET_DIR=target/release-gates \
            cargo +"$TOOLCHAIN" test --all-targets --locked --all-features
      - name: Verify exact Cargo feature table
        shell: bash
        run: |
          features=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -c '.packages[] | select(.name == "shoutx") | .features')
          test "$features" = '{"azure-pipelines":[],"default":["github-actions","azure-pipelines"],"github-actions":["dep:getrandom"]}'
          cargo tree --locked --all-features -e normal > target/stable-tree.txt
          cargo tree --locked -e normal > target/default-tree.txt
          diff -u target/stable-tree.txt target/default-tree.txt
      - name: Verify stdout publication gate failures
        run: python3 -B tests/workflow-smoke/test_stdout_release.py
      - name: Verify ID-bound publication and retry behavior
        run: python3 -B tests/workflow-smoke/test_release_publish.py
      - name: Verify release archive validator
        shell: bash
        run: |
          cargo +"$TOOLCHAIN" fmt \
            --manifest-path tools/archive-validator/Cargo.toml --all -- --check
          cargo +"$TOOLCHAIN" test --locked \
            --manifest-path tools/archive-validator/Cargo.toml
          cargo +"$TOOLCHAIN" clippy --all-targets --locked \
            --manifest-path tools/archive-validator/Cargo.toml -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          manifest-path: tools/archive-validator/Cargo.toml
          arguments: --config deny.toml --locked
          command-arguments: advisories bans licenses sources

  metadata:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
      toolchain: ${{ steps.toolchain.outputs.channel }}
      publish: ${{ steps.package.outputs.publish }}
      tag: ${{ steps.package.outputs.tag }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned shoutx release
        id: setup-shoutx
        uses: send/setup-shoutx@v0.2.0
        with:
          shoutx-version: '2.0.0'
          checksums-sha256: b366c56f14818e856939742c807889af882d881b5fa0ef6ed60ffd63eb3c6553
          github-token: ${{ github.token }}
      - name: Verify installed release and subsequent-step PATH
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.setup-shoutx.outputs.version }}
        run: |
          test "$INSTALLED_VERSION" = '2.0.0'
          test "$(shoutx --version)" = "shoutx $INSTALLED_VERSION"
      - id: toolchain
        shell: bash
        run: |
          shoutx=$(command -v shoutx)
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          if [[ ! "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rust toolchain must be one exact stable version"
            exit 1
          fi
          "$shoutx" github-actions:output channel "$channel" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install '${{ steps.toolchain.outputs.channel }}' --profile minimal
      - id: package
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shoutx=$(command -v shoutx)
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -er '.packages[] | select(.name == "shoutx") | .version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version"
            exit 1
          fi
          if [[ ${#version} -gt 39 ]]; then
            echo "Release version exceeds the revision-2 archive path limit"
            exit 1
          fi
          "$shoutx" github-actions:output version "$version" >> "$GITHUB_OUTPUT"
          "$shoutx" github-actions:output tag "v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            "$shoutx" github-actions:output prerelease true >> "$GITHUB_OUTPUT"
          else
            "$shoutx" github-actions:output prerelease false >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" != "push" ]]; then
            "$shoutx" github-actions:output publish false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_NAME" != "v$version" ]]; then
            echo "Tag does not match the Cargo package version"
            exit 1
          fi
          python3 -B scripts/check-stdout-release.py --sha "$COMMIT_SHA"
          "$shoutx" github-actions:output publish true >> "$GITHUB_OUTPUT"

  build:
    needs: [metadata, release-gates]
    strategy:
      fail-fast: false
      matrix:
        provider: [github-actions, azure-pipelines]
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extension: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
      TARGET: ${{ matrix.platform.target }}
      PROVIDER: ${{ matrix.provider }}
      EXTENSION: ${{ matrix.platform.extension }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Install musl linker
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build locked release binary
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/release-stable cargo +"$TOOLCHAIN" build \
            --release --locked --no-default-features --features "$PROVIDER" --target "$TARGET"
      - name: Verify official artifact identity and command surface
        shell: bash
        run: |
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          stable="target/release-stable/$TARGET/release/shoutx$suffix"
          test "$($stable --version)" = "shoutx $VERSION"
          SHOUTX_VERIFY_BINARY="$stable" SHOUTX_VERIFY_REQUIRE_EXTERNAL=1 \
            SHOUTX_EXPECT_SURFACE="$PROVIDER" CARGO_TARGET_DIR=target/verifier-stable \
            cargo +"$TOOLCHAIN" test --locked --no-default-features --features "$PROVIDER" --test stable_surface
      - name: Package and verify POSIX archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
          COPYFILE_DISABLE: "1"
        run: |
          root="shoutx-${PROVIDER}-v${VERSION}-${TARGET}"
          archive="${root}.tar.gz"
          mkdir -p "dist/$root" verify
          install -m 0755 "target/release-stable/$TARGET/release/shoutx" "dist/$root/shoutx"
          install -m 0644 README.md LICENSE "dist/$root/"
          tar --format=ustar -czf "dist/$archive" -C dist "$root"
          tar -xzf "dist/$archive" -C verify
          test "$(find "verify/$root" -type f | wc -l | tr -d ' ')" = 3
          test -x "verify/$root/shoutx"
          test -f "verify/$root/README.md"
          test -f "verify/$root/LICENSE"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            test "$(stat -c '%a' "verify/$root/shoutx")" = 755
            test "$(stat -c '%a' "verify/$root/README.md")" = 644
            test "$(stat -c '%a' "verify/$root/LICENSE")" = 644
          else
            test "$(stat -f '%Lp' "verify/$root/shoutx")" = 755
            test "$(stat -f '%Lp' "verify/$root/README.md")" = 644
            test "$(stat -f '%Lp' "verify/$root/LICENSE")" = 644
          fi
          SHOUTX_VERIFY_BINARY="$GITHUB_WORKSPACE/verify/$root/shoutx" \
            SHOUTX_VERIFY_REQUIRE_EXTERNAL=1 \
            SHOUTX_EXPECT_SURFACE="$PROVIDER" \
            CARGO_TARGET_DIR=target/verifier-extracted \
            cargo +"$TOOLCHAIN" test --locked --no-default-features --features "$PROVIDER" --test stable_surface
          rm -rf "dist/$root" verify
      - name: Package and verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "shoutx-${env:PROVIDER}-v${env:VERSION}-${env:TARGET}"
          $archive = "$root.zip"
          New-Item -ItemType Directory -Force -Path "dist/$root", "verify" | Out-Null
          Copy-Item "target/release-stable/$env:TARGET/release/shoutx.exe" "dist/$root/"
          Copy-Item README.md, LICENSE "dist/$root/"
          Compress-Archive -Path "dist/$root" -DestinationPath "dist/$archive"
          Expand-Archive "dist/$archive" -DestinationPath verify
          $files = Get-ChildItem -File "verify/$root"
          if ($files.Count -ne 3) { throw "Unexpected archive contents" }
          $env:SHOUTX_VERIFY_BINARY = "$pwd/verify/$root/shoutx.exe"
          $env:SHOUTX_VERIFY_REQUIRE_EXTERNAL = '1'
          $env:SHOUTX_EXPECT_SURFACE = $env:PROVIDER
          $env:CARGO_TARGET_DIR = 'target/verifier-extracted'
          cargo "+$env:TOOLCHAIN" test --locked --no-default-features --features "$env:PROVIDER" --test stable_surface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse "dist/$root", "verify"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: candidate-${{ matrix.provider }}-${{ matrix.platform.target }}
          path: dist/shoutx-${{ matrix.provider }}-v${{ needs.metadata.outputs.version }}-${{ matrix.platform.target }}.${{ matrix.platform.extension }}
          if-no-files-found: error
          retention-days: 2

  publish:
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    needs: [metadata, aggregate]
    concurrency:
      group: release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.metadata.outputs.tag }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Reverify publication inputs
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 11
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/*
      - name: Publish verified release
        run: python3 -B scripts/publish-release.py

  aggregate:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/release-candidates
          merge-multiple: true
      - name: Verify complete artifact set and checksums
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          candidate_dir="$RUNNER_TEMP/release-candidates"
          expected=$(mktemp)
          actual=$(mktemp)
          for provider in github-actions azure-pipelines; do
            for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
              echo "shoutx-${provider}-v${VERSION}-${target}.tar.gz"
            done
            echo "shoutx-${provider}-v${VERSION}-x86_64-pc-windows-msvc.zip"
          done > "$expected"
          LC_ALL=C sort -o "$expected" "$expected"
          find "$candidate_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          validated=0
          while IFS= read -r filename; do
            root=${filename%.tar.gz}
            root=${root%.zip}
            echo "Validating $filename"
            cargo +"$TOOLCHAIN" run --quiet --locked \
              --manifest-path tools/archive-validator/Cargo.toml -- \
              "$candidate_dir/$filename" "$root" </dev/null
            validated=$((validated + 1))
          done < "$expected"
          test "$validated" -eq 10
          (
            cd "$candidate_dir"
            while IFS= read -r filename; do
              sha256sum -- "$filename"
            done < "$expected" > SHA256SUMS
          )
          (cd "$candidate_dir" && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-candidates/
          if-no-files-found: error
          retention-days: 2
