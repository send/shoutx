# Manual trusted-revision admission; 20 native jobs plus one verifier.
trigger: none
pr: none
parameters:
  - name: hosts
    type: object
    default:
      - {name: linux, image: ubuntu-24.04}
      - {name: windows, image: windows-2025}
  - name: cases
    type: object
    default:
      - name: ordinary
        values: [{index: 0, name: Credential, flags: '--read-only', psflags: '-ReadOnly', mapping: '$(Credential)'}]
      - name: unicode
        values: [{index: 0, name: Credential, flags: '', psflags: '', mapping: '$(Credential)'}]
      - name: ascii
        values: [{index: 0, name: Credential, flags: '', psflags: '', mapping: '$(Credential)'}]
      - name: supplementary
        values: [{index: 0, name: Credential, flags: '', psflags: '', mapping: '$(Credential)'}]
      - name: whitespace
        values: [{index: 0, name: Credential, flags: '', psflags: '', mapping: '$(Credential)'}]
      - name: size
        values:
          - {index: 0, name: CapAscii, flags: '', psflags: '', mapping: '$(CapAscii)'}
          - {index: 1, name: CapUnicode, flags: '', psflags: '', mapping: '$(CapUnicode)'}
      - name: output
        values:
          - {index: 0, name: OutValue, flags: '--output', psflags: '-Output', mapping: '$(publish0.OutValue)'}
          - {index: 1, name: OutReadOnly, flags: '--output --read-only', psflags: '-Output -ReadOnly', mapping: '$(publish1.OutReadOnly)'}
      - name: control
        values: [{index: 0, name: Locked, flags: '--read-only', psflags: '-ReadOnly', mapping: '$(Locked)'}]

variables:
  DECODE_PERCENTS: 'true'
  AZP_IGNORE_SECRETS_SHORTER_THAN: '0'
  system.debug: 'false'
  CallerSentinel: caller-sentinel-unchanged

stages:
  - stage: Source
    jobs:
      - ${{ each host in parameters.hosts }}:
          - ${{ each case in parameters.cases }}:
              - job: ${{ host.name }}_${{ case.name }}
                displayName: ${{ host.name }}_${{ case.name }}
                timeoutInMinutes: 15
                ${{ if ne(case.name, 'ordinary') }}:
                  dependsOn: ${{ host.name }}_ordinary
                pool:
                  vmImage: ${{ host.image }}
                variables:
                  SHOUTX_SECRET_CASE: ${{ case.name }}
                steps:
                  - template: secret-steps.yml
                    parameters:
                      host: ${{ host.name }}
                      case: ${{ case.name }}
                      values: ${{ case.values }}
          - job: ${{ host.name }}_dependent
            displayName: ${{ host.name }}_dependent
            dependsOn: ${{ host.name }}_output
            timeoutInMinutes: 15
            pool:
              vmImage: ${{ host.image }}
            variables:
              SHOUTX_SECRET_CASE: dependent
              ForwardValue: $[ dependencies.${{ host.name }}_output.outputs['publish0.OutValue'] ]
              ForwardReadOnly: $[ dependencies.${{ host.name }}_output.outputs['publish1.OutReadOnly'] ]
            steps:
              - template: secret-steps.yml
                parameters:
                  host: ${{ host.name }}
                  case: dependent
                  receiver: true
                  values:
                    - {index: 0, mapping: '$(ForwardValue)'}
                    - {index: 1, mapping: '$(ForwardReadOnly)'}
  - stage: Destination
    dependsOn: Source
    condition: succeededOrFailed()
    jobs:
      - ${{ each host in parameters.hosts }}:
          - job: ${{ host.name }}_stage
            displayName: ${{ host.name }}_stage
            timeoutInMinutes: 15
            pool:
              vmImage: ${{ host.image }}
            variables:
              SHOUTX_SECRET_CASE: stage
              ForwardValue: $[ stageDependencies.Source.${{ host.name }}_output.outputs['publish0.OutValue'] ]
              ForwardReadOnly: $[ stageDependencies.Source.${{ host.name }}_output.outputs['publish1.OutReadOnly'] ]
            steps:
              - template: secret-steps.yml
                parameters:
                  host: ${{ host.name }}
                  case: stage
                  receiver: true
                  values:
                    - {index: 0, mapping: '$(ForwardValue)'}
                    - {index: 1, mapping: '$(ForwardReadOnly)'}
  - stage: Verification
    dependsOn: [Source, Destination]
    condition: always()
    jobs:
      - job: verify_secrets
        timeoutInMinutes: 15
        pool:
          vmImage: ubuntu-24.04
        steps:
          - checkout: self
            persistCredentials: false
          - task: PythonScript@0
            displayName: Verify completed secret-variable jobs
            inputs:
              scriptSource: filePath
              scriptPath: tests/azure-hosted/secret_verify.py
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
