# verify-mask-logs.yml selects this workflow by its display name.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '37 3 * * 3' # Wednesday 03:37 UTC / 12:37 JST
  workflow_dispatch:

permissions:
  contents: read

env:
  SHOUTX_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  stable-docs:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: scripts/verify-stable-docs.sh
      - run: python3 -B scripts/generate-stdout-start-table.py --check
      - name: Test CI event scope
        run: python3 -B tests/workflow-smoke/test_ci_scope.py
      - name: Test trusted stdout verification
        run: python3 -B tests/workflow-smoke/test_stdout_run.py
      - name: Test source-bound publication gate
        run: python3 -B tests/workflow-smoke/test_stdout_release.py

  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned shoutx release
        shell: bash
        run: .github/scripts/install-shoutx.sh
      - name: Detect non-documentation changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shoutx="$RUNNER_TEMP/shoutx-bootstrap/bin/shoutx"
          run_ci=$(bash .github/scripts/ci-scope.sh)
          "$shoutx" github-actions:output run_ci "$run_ci" >> "$GITHUB_OUTPUT"

  unicode-policy:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    uses: ./.github/workflows/unicode-policy.yml

  dependencies:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources

  test:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: target/stable
      STATE_ACTION_BINARY: ${{ github.workspace }}/target/stable/debug/shoutx
      STABLE_BINARY: ${{ github.workspace }}/target/stable/debug/shoutx${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      UNSTABLE_BINARY: ${{ github.workspace }}/target/unstable/debug/shoutx${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --all-targets --no-default-features
        env:
          SHOUTX_EXPECT_SURFACE: stable
      - run: cargo +stable clippy --all-targets --no-default-features -- -D warnings
      - run: cargo +stable build --no-default-features
      - name: Test unstable stdout research surface
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = 'target/unstable'
          $env:SHOUTX_EXPECT_SURFACE = 'unstable'
          cargo +stable test --all-targets --features unstable-github-actions-stdout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable clippy --all-targets --features unstable-github-actions-stdout -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --features unstable-github-actions-stdout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = cargo metadata --format-version 1 --no-deps --locked |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata.packages | Where-Object name -CEQ 'shoutx').version
          $stableVersion = @(& $env:STABLE_BINARY --version) -join "`n"
          if ($stableVersion -cne "shoutx $version") {
            throw 'Stable binary identity mismatch'
          }
          $unstableVersion = @(& $env:UNSTABLE_BINARY --version) -join "`n"
          if ($unstableVersion -cne "shoutx $version (unstable-github-actions-stdout)") {
            throw 'Unstable binary identity mismatch'
          }
      - name: Dogfood GitHub action state
        uses: ./tests/workflow-state-action
        with:
          binary: ${{ env.STATE_ACTION_BINARY }}
      - name: Verify state is not a step environment export
        shell: bash
        run: test -z "${STATE_Result+x}"
      - name: Test hosted boundary verifier offline
        shell: bash
        run: python -B tests/workflow-smoke/test_hosted_boundaries.py
      - name: Exercise hosted stdout boundaries
        shell: bash
        run: python -B tests/workflow-smoke/hosted_boundaries.py emit
      - name: Dogfood GitHub environment files on POSIX
        id: dogfood_posix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dogfood_path="$RUNNER_TEMP/shoutx-dogfood-bin"
          mkdir -p "$dogfood_path"
          "$STABLE_BINARY" github-actions:output value 'output % 日本語' >> "$GITHUB_OUTPUT"
          "$STABLE_BINARY" github-actions:output --multiline multiline $'first\nsecond\n' >> "$GITHUB_OUTPUT"
          "$STABLE_BINARY" github-actions:env SHOUTX_DOGFOOD_ENV 'env % 日本語' >> "$GITHUB_ENV"
          "$STABLE_BINARY" github-actions:path "$dogfood_path" >> "$GITHUB_PATH"
          mask_marker="shoutx-mask-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          export SHOUTX_MASK_VALUE="$mask_marker"
          printf %s "$SHOUTX_MASK_VALUE" | "$UNSTABLE_BINARY" github-actions:mask
          "$STABLE_BINARY" github-actions:output masked_value "$mask_marker" >> "$GITHUB_OUTPUT"
          printf 'SHOUTX_MASK_BASH_%s_BEGIN%s_END\n' "$RUNNER_OS" "$mask_marker"
          annotation_file="$GITHUB_WORKSPACE/src/annotation,percent%25-ASCII.rs"
          "$UNSTABLE_BINARY" github-actions:notice \
            --title "shoutx annotation notice $RUNNER_OS :: %,ASCII" \
            --file "$annotation_file" --line 1 'notice % :: 日本語'
          "$UNSTABLE_BINARY" github-actions:warning \
            --title "shoutx annotation warning $RUNNER_OS :: %,ASCII" \
            --file "$annotation_file" --line 1 --column 1 $'warning first\nwarning second 日本語'
          "$UNSTABLE_BINARY" github-actions:error \
            --title "shoutx annotation error $RUNNER_OS :: %,ASCII" \
            --file "$annotation_file" --line 1 'error annotation does not fail the step'
      - name: Verify dogfooded values on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          DOGFOOD_OUTPUT: ${{ steps.dogfood_posix.outputs.value }}
          DOGFOOD_MULTILINE: ${{ steps.dogfood_posix.outputs.multiline }}
          DOGFOOD_MASKED: ${{ steps.dogfood_posix.outputs.masked_value }}
        run: |
          [[ "$DOGFOOD_OUTPUT" == 'output % 日本語' ]]
          [[ "$DOGFOOD_MULTILINE" == $'first\nsecond\n' ]]
          [[ "$SHOUTX_DOGFOOD_ENV" == 'env % 日本語' ]]
          [[ "$DOGFOOD_MASKED" == shoutx-mask-* ]]
          [[ ":$PATH:" == *":$RUNNER_TEMP/shoutx-dogfood-bin:"* ]]
      - name: Dogfood mask through POSIX sh
        if: runner.os != 'Windows'
        shell: sh
        run: |
          mask_marker="shoutx-mask-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          printf %s "$mask_marker" | "$UNSTABLE_BINARY" github-actions:mask
          printf 'SHOUTX_MASK_SH_%s_BEGIN%s_END\n' "$RUNNER_OS" "$mask_marker"
      - name: Dogfood GitHub environment files on Windows
        id: dogfood_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dogfoodPath = Join-Path $env:RUNNER_TEMP 'shoutx-dogfood-bin'
          New-Item -ItemType Directory -Force $dogfoodPath | Out-Null
          & $env:STABLE_BINARY github-actions:output value 'output % 日本語' >> $env:GITHUB_OUTPUT
          & $env:STABLE_BINARY github-actions:output --multiline multiline "first`nsecond`n" >> $env:GITHUB_OUTPUT
          & $env:STABLE_BINARY github-actions:env SHOUTX_DOGFOOD_ENV 'env % 日本語' >> $env:GITHUB_ENV
          & $env:STABLE_BINARY github-actions:path $dogfoodPath >> $env:GITHUB_PATH
          $maskMarker = "shoutx-mask-$([guid]::NewGuid())"
          $maskMarker | & $env:UNSTABLE_BINARY github-actions:mask
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:STABLE_BINARY github-actions:output masked_value $maskMarker >> $env:GITHUB_OUTPUT
          Write-Output "SHOUTX_MASK_PWSH_WINDOWS_BEGIN${maskMarker}_END"
          $annotationFile = Join-Path $env:GITHUB_WORKSPACE 'src/annotation,percent%25-ASCII.rs'
          & $env:UNSTABLE_BINARY github-actions:notice `
            --title 'shoutx annotation notice Windows :: %,ASCII' `
            --file $annotationFile --line 1 'notice % :: 日本語'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:UNSTABLE_BINARY github-actions:warning `
            --title 'shoutx annotation warning Windows :: %,ASCII' `
            --file $annotationFile --line 1 --column 1 "warning first`nwarning second 日本語"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:UNSTABLE_BINARY github-actions:error `
            --title 'shoutx annotation error Windows :: %,ASCII' `
            --file $annotationFile --line 1 'error annotation does not fail the step'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify dogfooded values on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOGFOOD_OUTPUT: ${{ steps.dogfood_windows.outputs.value }}
          DOGFOOD_MULTILINE: ${{ steps.dogfood_windows.outputs.multiline }}
          DOGFOOD_MASKED: ${{ steps.dogfood_windows.outputs.masked_value }}
        run: |
          if ($env:DOGFOOD_OUTPUT -cne 'output % 日本語') { throw 'Output mismatch' }
          if ($env:DOGFOOD_MULTILINE -cne "first`nsecond`n") { throw 'Multiline mismatch' }
          if ($env:SHOUTX_DOGFOOD_ENV -cne 'env % 日本語') { throw 'Environment mismatch' }
          if (-not $env:DOGFOOD_MASKED.StartsWith('shoutx-mask-')) { throw 'Masked step output mismatch' }
          $expectedPath = Join-Path $env:RUNNER_TEMP 'shoutx-dogfood-bin'
          if ($expectedPath -notin ($env:PATH -split ';')) { throw 'PATH mismatch' }
      - name: POSIX shell smoke tests
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh tests/workflow-smoke/posix.sh "$STABLE_BINARY" sh stable
          sh tests/workflow-smoke/posix.sh "$UNSTABLE_BINARY" sh unstable
          bash tests/workflow-smoke/posix.sh "$STABLE_BINARY" bash stable
          bash tests/workflow-smoke/posix.sh "$UNSTABLE_BINARY" bash unstable
      - name: Dash smoke tests
        id: dash_smoke
        if: runner.os == 'Linux'
        shell: dash -e {0}
        run: |
          command -v dash
          dpkg-query --show --showformat='dash ${Version}\n' dash
          dash tests/workflow-smoke/posix.sh "$STABLE_BINARY" dash stable
          dash tests/workflow-smoke/posix.sh "$UNSTABLE_BINARY" dash unstable
          "$STABLE_BINARY" github-actions:output value 'dash % 日本語' >> "$GITHUB_OUTPUT"
          mask_marker="shoutx-mask-$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          printf %s "$mask_marker" | "$UNSTABLE_BINARY" github-actions:mask
          printf 'SHOUTX_MASK_DASH_LINUX_BEGIN%s_END\n' "$mask_marker"
      - name: Verify Dash workflow output
        if: runner.os == 'Linux'
        shell: dash -e {0}
        env:
          DASH_OUTPUT: ${{ steps.dash_smoke.outputs.value }}
        run: test "$DASH_OUTPUT" = 'dash % 日本語'
      - name: PowerShell smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tests/workflow-smoke/windows.ps1 -Binary $env:STABLE_BINARY
          tests/workflow-smoke/windows.ps1 -Binary $env:UNSTABLE_BINARY -UnstableStdout
      - name: Invalid Windows standard handles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c `
            "`"$devcmd`" -no_logo -arch=x64 && cl.exe /nologo /W4 /WX tests\workflow-smoke\windows_invalid_handle.c /Fe:target\windows_invalid_handle.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/windows_invalid_handle.exe `
            (Resolve-Path $env:STABLE_BINARY)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Git Bash smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHOUTX_STABLE_BIN: ${{ env.STABLE_BINARY }}
          SHOUTX_UNSTABLE_BIN: ${{ env.UNSTABLE_BINARY }}
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc `
            'tests/workflow-smoke/posix.sh "$(cygpath -u "$SHOUTX_STABLE_BIN")" bash stable'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc `
            'tests/workflow-smoke/posix.sh "$(cygpath -u "$SHOUTX_UNSTABLE_BIN")" bash unstable'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc `
            'set -euo pipefail; marker="shoutx-mask-$(od -An -N16 -tx1 /dev/urandom | tr -d " \n")"; printf %s "$marker" | "$(cygpath -u "$SHOUTX_UNSTABLE_BIN")" github-actions:mask; printf "SHOUTX_MASK_GIT_BASH_WINDOWS_BEGIN%s_END\n" "$marker"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Mark hosted test sequence complete
        shell: bash
        run: python -B tests/workflow-smoke/hosted_boundaries.py finish

  msrv:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.85.0 fmt --all -- --check
      - run: SHOUTX_EXPECT_SURFACE=stable CARGO_TARGET_DIR=target/msrv-stable cargo +1.85.0 test --all-targets --no-default-features
      - run: CARGO_TARGET_DIR=target/msrv-stable cargo +1.85.0 clippy --all-targets --no-default-features -- -D warnings
      - run: SHOUTX_EXPECT_SURFACE=unstable CARGO_TARGET_DIR=target/msrv-unstable cargo +1.85.0 test --all-targets --features unstable-github-actions-stdout
      - run: CARGO_TARGET_DIR=target/msrv-unstable cargo +1.85.0 clippy --all-targets --features unstable-github-actions-stdout -- -D warnings

  runner-differential:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            runtime: linux-x64
          - os: ubuntu-24.04
            runtime: linux-x64
          - os: macos-15
            runtime: osx-arm64
          - os: windows-2025
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/runner
          ref: 397b032cbf865e9c3ddfab89d533ec19325e1273
          path: target/runner-oracle/actions-runner
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.424
      - name: Verify pinned .NET SDK
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          if ((dotnet --version) -ne '8.0.424') {
            throw "Expected .NET SDK 8.0.424, got $(dotnet --version)"
          }
      - run: rustup toolchain install stable --profile minimal
      - name: Test offline managed reference inventory
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet build "$env:GITHUB_WORKSPACE/tests/runner-package/managed-references/ManagedReferences.csproj" --nologo
          dotnet run --project "$env:GITHUB_WORKSPACE/tests/runner-package/managed-references/tests/Tests.csproj"
          python -B "$env:GITHUB_WORKSPACE/tests/runner-package/managed-references/tests/test_cli.py" "$env:GITHUB_WORKSPACE/tests/runner-package/managed-references/bin/Debug/net8.0/ManagedReferences.dll"
      - name: Generate and validate shared corpus
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $env:CARGO_TARGET_DIR = 'target/oracle-stable'
          cargo +stable test --no-default-features --test runner_differential_fixture
          cargo +stable test --no-default-features --test path_runner_fixture
          $env:CARGO_TARGET_DIR = 'target/oracle-unstable'
          cargo +stable test --features unstable-github-actions-stdout --test mask_runner_fixture
          cargo +stable test --features unstable-github-actions-stdout --test annotation_runner_fixture
          $env:SHOUTX_CORPUS_PATH = "$pwd/target/runner-oracle/corpus.json"
          Remove-Item -ErrorAction Ignore $env:SHOUTX_CORPUS_PATH
          $env:CARGO_TARGET_DIR = 'target/oracle-stable'
          cargo +stable test --no-default-features --test runner_differential_fixture export_runner_corpus -- --ignored
          $env:SHOUTX_PATH_CORPUS_PATH = "$pwd/target/runner-oracle/path-corpus.json"
          Remove-Item -ErrorAction Ignore $env:SHOUTX_PATH_CORPUS_PATH
          cargo +stable test --no-default-features --test path_runner_fixture export_path_corpus -- --ignored
          $env:SHOUTX_MASK_CORPUS_PATH = "$pwd/target/runner-oracle/mask-corpus.json"
          Remove-Item -ErrorAction Ignore $env:SHOUTX_MASK_CORPUS_PATH
          $env:CARGO_TARGET_DIR = 'target/oracle-unstable'
          cargo +stable test --features unstable-github-actions-stdout --test mask_runner_fixture export_mask_corpus -- --ignored
          $env:SHOUTX_ANNOTATION_CORPUS_PATH = "$pwd/target/runner-oracle/annotation-corpus.json"
          Remove-Item -ErrorAction Ignore $env:SHOUTX_ANNOTATION_CORPUS_PATH
          cargo +stable test --features unstable-github-actions-stdout --test annotation_runner_fixture export_annotation_corpus -- --ignored
          foreach ($corpus in @($env:SHOUTX_CORPUS_PATH, $env:SHOUTX_PATH_CORPUS_PATH, $env:SHOUTX_MASK_CORPUS_PATH, $env:SHOUTX_ANNOTATION_CORPUS_PATH)) {
            if (-not (Test-Path $corpus) -or (Get-Item $corpus).Length -eq 0) { throw "Missing fresh corpus" }
          }
      - name: Build pinned runner oracle
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          Copy-Item ${{ github.workspace }}/tests/runner-oracle/ShoutxDifferentialL0.cs Test/L0/Worker/
          dotnet build Test/Test.csproj `
            --configuration Release `
            -p:PackageRuntime=${{ matrix.runtime }} `
            -p:NuGetAudit=false
      - name: Compare pinned runner parser
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        env:
          SHOUTX_CORPUS: ${{ github.workspace }}/target/runner-oracle/corpus.json
          SHOUTX_PATH_CORPUS: ${{ github.workspace }}/target/runner-oracle/path-corpus.json
          SHOUTX_MASK_CORPUS: ${{ github.workspace }}/target/runner-oracle/mask-corpus.json
          SHOUTX_ANNOTATION_CORPUS: ${{ github.workspace }}/target/runner-oracle/annotation-corpus.json
        run: |
          dotnet test Test/Test.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter 'FullyQualifiedName~ShoutxDifferentialL0' `
            --logger 'console;verbosity=detailed' `
            --logger 'trx;LogFileName=runner-oracle.trx' `
            --results-directory '${{ github.workspace }}/target/runner-oracle-results'
      - name: Test published Runner runtime and parser
        env:
          RUSTUP_TOOLCHAIN: stable
        shell: pwsh
        run: |
          python -B tests/runner-package/test_harness.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_mapping_inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_icu_source_comparison.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_compiled_nfc.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_structural_graph.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_windows_icu_metadata.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_pe_prefix_digest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_icu_data_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_icu_package_inventory.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_icu_elf_package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B tests/runner-package/test_icu_resource_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/test-runner-package.py --output target/runner-package-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test environment transport controls independently
        if: ${{ always() }}
        shell: pwsh
        run: |
          python -B tests/runner-package/test_environment_transport.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain package runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runner-package-evidence-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            target/runner-package-evidence/
            target/runner-oracle-results/
          if-no-files-found: error
          retention-days: 30

      - name: Test hosted Worker input projection offline
        shell: bash
        run: |
          python -B tests/runner-package/test_hosted_worker.py
          python -B tests/runner-package/test_hosted_modules.py
      - name: Observe hosted Worker startup input availability
        id: worker_observation
        shell: python -I -S {0}
        env:
          SHOUTX_MATRIX_OS: ${{ matrix.os }}
          SHOUTX_MATRIX_RID: ${{ matrix.runtime }}
        run: |
          import runpy
          import sys
          sys.argv = ["hosted_worker.py", "--output", "target/hosted-worker-evidence.json"]
          runpy.run_path("tests/runner-package/hosted_worker.py", run_name="__main__")
      - name: Retain limited hosted Worker observation
        if: ${{ always() && steps.worker_observation.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-worker-input-${{ matrix.os }}-${{ matrix.runtime }}
          path: target/hosted-worker-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Observe hosted Worker module metadata availability
        id: worker_modules
        timeout-minutes: 2
        shell: bash
        env:
          SHOUTX_MATRIX_OS: ${{ matrix.os }}
          SHOUTX_MATRIX_RID: ${{ matrix.runtime }}
        run: python -B tests/runner-package/hosted_modules.py --output target/hosted-worker-modules.json
      - name: Retain limited hosted Worker module metadata
        if: ${{ always() && steps.worker_modules.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-worker-modules-${{ matrix.os }}-${{ matrix.runtime }}
          path: target/hosted-worker-modules.json
          if-no-files-found: error
          retention-days: 30
      - name: Build research binary for package-matched hosted observations
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = 'target/hosted-research'
          cargo +stable build --locked --features unstable-github-actions-stdout
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise package-matched hosted boundaries
        shell: bash
        env:
          UNSTABLE_BINARY: ${{ github.workspace }}/target/hosted-research/debug/shoutx${{ matrix.os == 'windows-2025' && '.exe' || '' }}
        run: python -B tests/workflow-smoke/hosted_boundaries.py emit
      - name: Mark package-matched hosted sequence complete
        shell: bash
        run: python -B tests/workflow-smoke/hosted_boundaries.py finish

  hosted-annotations:
    needs: [changes, test, runner-differential]
    if: ${{ always() }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: ${{ needs.changes.outputs.run_ci == 'true' }}
        with:
          persist-credentials: false
      - name: Verify hosted annotation round trips
        if: ${{ needs.changes.outputs.run_ci == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="$RUNNER_TEMP/jobs.json"
          gh api --paginate \
            "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | [.name, .conclusion, .check_run_url, .id, .run_attempt] | @tsv' > "$jobs_json"

          for os in ubuntu-latest macos-latest windows-latest; do
            job="test ($os)"
            count=$(awk -F '\t' -v name="$job" '$1 == name { count += 1 } END { print count + 0 }' "$jobs_json")
            if [[ "$count" != 1 ]]; then
              echo "Expected exactly one $job" >&2
              exit 1
            fi
            row=$(awk -F '\t' -v name="$job" '$1 == name { print; exit }' "$jobs_json")
            conclusion=$(printf '%s\n' "$row" | cut -f2)
            if [[ "$conclusion" != success ]]; then
              echo "Expected $job to succeed, got: ${conclusion:-missing}" >&2
              exit 1
            fi
            check_url=$(printf '%s\n' "$row" | cut -f3)
            job_id=$(printf '%s\n' "$row" | cut -f4)
            source_attempt=$(printf '%s\n' "$row" | cut -f5)
            endpoint="${check_url#https://api.github.com/}/annotations?per_page=100"
            annotations="$RUNNER_TEMP/annotations-$os.json"
            pages="$RUNNER_TEMP/annotation-pages-$os.json"
            case "$os" in
              ubuntu-latest) runner_os=Linux ;;
              macos-latest) runner_os=macOS ;;
              windows-latest) runner_os=Windows ;;
            esac
            verified=false
            for attempt in {1..6}; do
              if ! gh api --paginate --slurp "$endpoint" > "$pages"; then
                echo "$job annotation API request failed (attempt $attempt of 6)"
                sleep 10
                continue
              fi
              jq 'add' "$pages" > "$annotations"
              if jq -e --arg os "$runner_os" '
                any(.[]; .annotation_level == "notice" and
                  .title == "shoutx annotation notice \($os) :: %,ASCII" and
                  .message == "notice % :: 日本語" and
                  .path == "src/annotation,percent%25-ASCII.rs" and
                  .start_line == 1 and .end_line == 1) and
                any(.[]; .annotation_level == "warning" and
                  .title == "shoutx annotation warning \($os) :: %,ASCII" and
                  .message == "warning first\nwarning second 日本語" and
                  .path == "src/annotation,percent%25-ASCII.rs" and .start_line == 1 and
                  .end_line == 1 and .start_column == 1 and .end_column == 1) and
                any(.[]; .annotation_level == "failure" and
                  .title == "shoutx annotation error \($os) :: %,ASCII" and
                  .message == "error annotation does not fail the step" and
                  .path == "src/annotation,percent%25-ASCII.rs" and
                  .start_line == 1 and .end_line == 1)
              ' "$annotations" >/dev/null; then
                verified=true
                break
              fi
              echo "$job annotations are not complete yet (attempt $attempt of 6)"
              sleep 10
            done
            if [[ "$verified" != true ]]; then
              echo "Missing or mismatched shoutx annotations for $job" >&2
              exit 1
            fi

            raw_log="$RUNNER_TEMP/log-$os.txt"
            log_messages="$RUNNER_TEMP/log-messages-$os.txt"
            boundary_verified=false
            for attempt in {1..6}; do
              if curl --fail --silent --show-error --location --max-time 30 \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header 'X-GitHub-Api-Version: 2026-03-10' \
                  "https://api.github.com/repos/$GH_REPO/actions/jobs/$job_id/logs" > "$raw_log" &&
                gh api --paginate --slurp "$endpoint" > "$pages" &&
                jq 'add' "$pages" > "$annotations" &&
                python -B tests/workflow-smoke/hosted_boundaries.py verify \
                  --log "$raw_log" --annotations "$annotations" --os "$runner_os" \
                  --job-id "$job_id" --source-attempt "$source_attempt" \
                  --evidence "$RUNNER_TEMP/hosted-boundary-evidence/$os.json"; then
                boundary_verified=true
                break
              fi
              echo "$job boundary evidence is not verified (attempt $attempt of 6)"
              sleep 10
            done
            if [[ "$boundary_verified" != true ]]; then
              exit 1
            fi
            sed -E 's/\r$//; s/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+Z //' \
              "$raw_log" > "$log_messages"
            for expected in \
              '##[notice]notice % :: 日本語' \
              '##[error]error annotation does not fail the step'; do
              if [[ $(grep -Fxc -- "$expected" "$log_messages") -ne 1 ]]; then
                echo "Missing or duplicated exact log line for $job" >&2
                exit 1
              fi
            done
            if ! awk '
              $0 == "##[warning]warning first" {
                getline
                if ($0 == "warning second 日本語") {
                  matches++
                }
              }
              END { exit matches == 1 ? 0 : 1 }
            ' "$log_messages"; then
              echo "Missing or duplicated exact multiline warning log text for $job" >&2
              exit 1
            fi

          done
      - name: Verify package-matched hosted observations
        id: research_boundaries
        if: ${{ always() && needs.changes.outputs.run_ci == 'true' }}
        shell: bash
        run: |
          command -v jq
          python -B tests/workflow-smoke/test_research_boundaries.py
          bash .github/scripts/verify-research-boundaries.sh
      - name: Summarize package-matched verification outcome
        if: ${{ always() && needs.changes.outputs.run_ci == 'true' }}
        shell: bash
        env:
          RESEARCH_OUTCOME: ${{ steps.research_boundaries.outcome }}
        run: |
          echo "Package-matched boundary verification outcome (four rows): $RESEARCH_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Summarize hosted Runner compatibility
        if: ${{ always() && needs.changes.outputs.run_ci == 'true' }}
        run: python -B tests/workflow-smoke/hosted_boundaries.py summary --evidence "$RUNNER_TEMP/hosted-boundary-evidence"
      - name: Retain hosted boundary observations
        if: ${{ always() && needs.changes.outputs.run_ci == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hosted-boundary-evidence
          path: ${{ runner.temp }}/hosted-boundary-evidence/
          if-no-files-found: error
          retention-days: 30

  # The main-branch ruleset requires this stable aggregate check rather than
  # individual matrix checks.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [stable-docs, changes, dependencies, test, msrv, runner-differential, unicode-policy, hosted-annotations]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Verify required job results
        shell: bash
        env:
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          STABLE_DOCS_RESULT: ${{ needs.stable-docs.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          RUNNER_DIFFERENTIAL_RESULT: ${{ needs.runner-differential.result }}
          UNICODE_POLICY_RESULT: ${{ needs.unicode-policy.result }}
          HOSTED_ANNOTATIONS_RESULT: ${{ needs.hosted-annotations.result }}
        run: |
          if [[ "$STABLE_DOCS_RESULT" != "success" ]]; then
            echo "Stable documentation verification did not succeed"
            exit 1
          fi
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed"
            exit 1
          fi
          if [[ "$HOSTED_ANNOTATIONS_RESULT" != "success" ]]; then
            echo "Hosted annotation verification did not succeed"
            exit 1
          fi

          if [[ "$RUN_CI" == "true" ]]; then
            expected="success"
          elif [[ "$RUN_CI" == "false" ]]; then
            expected="skipped"
          else
            echo "Change detection produced an invalid result"
            exit 1
          fi

          for result in \
            "$DEPENDENCIES_RESULT" \
            "$TEST_RESULT" \
            "$MSRV_RESULT" \
            "$RUNNER_DIFFERENTIAL_RESULT" \
            "$UNICODE_POLICY_RESULT"
          do
            if [[ "$result" != "$expected" ]]; then
              echo "Expected dependent jobs to be $expected, got $result"
              exit 1
            fi
          done
