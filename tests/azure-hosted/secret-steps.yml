parameters:
  - name: host
    type: string
  - name: case
    type: string
  - name: values
    type: object
  - name: receiver
    type: boolean
    default: false

steps:
  - checkout: self
    persistCredentials: false
  - ${{ if eq(parameters.case, 'ordinary') }}:
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release --locked --no-default-features
          python -B tests/azure-hosted/test_secret_stdin.py
          python -B tests/azure-hosted/secret_producer.py package
        displayName: Build source-bound binary
      - publish: $(Pipeline.Workspace)/secret-binary
        artifact: secret-binary-${{ parameters.host }}
        displayName: Publish binary before registration
  - ${{ else }}:
      - download: current
        artifact: secret-binary-${{ parameters.host }}
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          Move-Item -LiteralPath '$(Pipeline.Workspace)/secret-binary-${{ parameters.host }}' -Destination '$(Pipeline.Workspace)/secret-binary'
        displayName: Place source-bound binary
  - task: PythonScript@0
    displayName: Prepare secret fixture
    inputs:
      scriptSource: filePath
      scriptPath: tests/azure-hosted/secret_producer.py
      arguments: prepare
  - ${{ if eq(parameters.case, 'control') }}:
      - ${{ each stream in split('OUT,ERR', ',') }}:
          - task: PythonScript@0
            displayName: Calibrate ${{ stream }}
            inputs:
              scriptSource: filePath
              scriptPath: tests/azure-hosted/secret_producer.py
              arguments: calibrate ${{ stream }}
      - ${{ each phase in split('plain,plain-check', ',') }}:
          - task: PythonScript@0
            displayName: Control ${{ phase }}
            inputs:
              scriptSource: filePath
              scriptPath: tests/azure-hosted/secret_producer.py
              arguments: control ${{ phase }}
  - ${{ each value in parameters.values }}:
      - ${{ if not(parameters.receiver) }}:
          - ${{ if eq(parameters.host, 'linux') }}:
              - bash: |
                  set -euo pipefail
                  set +x
                  source tests/azure-hosted/secret-variable-stdin.bash
                  set_shoutx_secret_variable "$PIPELINE_WORKSPACE/secret-binary/shoutx" ${{ value.flags }} -- ${{ value.name }} < "$AGENT_TEMPDIRECTORY/shoutx-secret-${{ value.index }}.bin"
                  printf '%s\n' SV_REGISTERED_${{ value.index }}
                name: publish${{ value.index }}
                displayName: Register ${{ value.index }}
          - ${{ else }}:
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  Set-PSDebug -Off
                  . ./tests/azure-hosted/secret-variable-stdin.ps1
                  $stream = [IO.File]::OpenRead("$env:AGENT_TEMPDIRECTORY/shoutx-secret-${{ value.index }}.bin")
                  try {
                    Set-ShoutxSecretVariable -Binary "$env:PIPELINE_WORKSPACE/secret-binary/shoutx.exe" -InputStream $stream -Name '${{ value.name }}' ${{ value.psflags }}
                  } finally { $stream.Dispose() }
                  Write-Output 'SV_REGISTERED_${{ value.index }}'
                name: publish${{ value.index }}
                displayName: Register ${{ value.index }}
      - task: PythonScript@0
        displayName: Unmapped ${{ value.index }}
        inputs:
          scriptSource: filePath
          scriptPath: tests/azure-hosted/secret_producer.py
          arguments: unmapped ${{ value.index }}
      - ${{ each stream in split('OUT,ERR', ',') }}:
          - task: PythonScript@0
            displayName: Consume ${{ value.index }} ${{ stream }}
            inputs:
              scriptSource: filePath
              scriptPath: tests/azure-hosted/secret_producer.py
              arguments: consume ${{ value.index }} ${{ stream }}
            env:
              SV_MAPPED: ${{ value.mapping }}
  - ${{ if eq(parameters.case, 'control') }}:
      - ${{ each phase in split('wrong,omission-check', ',') }}:
          - task: PythonScript@0
            displayName: Control ${{ phase }}
            inputs:
              scriptSource: filePath
              scriptPath: tests/azure-hosted/secret_producer.py
              arguments: control ${{ phase }}
      - task: PythonScript@0
        displayName: Expected readonly rejection
        continueOnError: true
        inputs:
          scriptSource: filePath
          scriptPath: tests/azure-hosted/secret_producer.py
          arguments: control overwrite
      - task: PythonScript@0
        displayName: Readonly followup
        condition: succeededOrFailed()
        inputs:
          scriptSource: filePath
          scriptPath: tests/azure-hosted/secret_producer.py
          arguments: control readonly-check
        env:
          SV_MAPPED: $(Locked)
