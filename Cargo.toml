[package]
name = "shoutx"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Safe writers for CI workflow output boundaries"
repository = "https://github.com/send/shoutx"

[features]
default = []

[dependencies]
getrandom = "0.4.3"

[dev-dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[[test]]
name = "annotation_contract"

[[test]]
name = "annotation_runner_fixture"

[[test]]
name = "mask_contract"

[[test]]
name = "mask_runner_fixture"

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
