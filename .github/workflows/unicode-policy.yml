name: Unicode policy integration

on:
  # CI owns PR/push filtering and the schedule/manual entry points. Keeping the
  # probe in that run binds its result to the same source run and attempt.
  workflow_call:

permissions:
  contents: read

jobs:
  candidate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 8.0.427
      - name: Check candidate with pinned parser
        shell: pwsh
        run: |
          python -B scripts/test-unicode-policy.py --output target/unicode-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain aggregate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unicode-policy-${{ matrix.os }}
          path: |
            target/unicode-policy/report.json
            target/unicode-policy/probe.json
          if-no-files-found: error
          retention-days: 7
