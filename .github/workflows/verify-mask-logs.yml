name: Verify hosted mask logs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  verify:
    if: >-
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # workflow_run's github.sha is the trusted default-branch revision, NOT
      # the triggering run's head_sha. Never checkout/execute triggering code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact completed source attempt
        run: python3 -B scripts/verify-stdout-run.py --output "$RUNNER_TEMP/stdout-verification/report.json"
      - name: Retain bounded source-bound verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stdout-verification-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/stdout-verification/report.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true
