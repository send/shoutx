name: Unicode policy candidate

on:
  push:
    branches: [feat/unicode-stdout-policy]
    paths:
      - '.gitattributes'
      - '.github/workflows/unicode-policy.yml'
      - 'tests/unicode-policy-probe/**'
      - 'scripts/test-unicode-policy.py'

permissions:
  contents: read

jobs:
  candidate:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.424
      - name: Check candidate with pinned parser
        shell: pwsh
        run: |
          python -B scripts/test-unicode-policy.py --output target/unicode-policy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unicode-policy-${{ matrix.os }}
          path: |
            target/unicode-policy/report.json
            target/unicode-policy/probe.json
          if-no-files-found: error
          retention-days: 7
