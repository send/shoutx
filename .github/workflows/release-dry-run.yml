name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
    paths:
      - .github/workflows/release-dry-run.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    permissions:
      contents: read
      checks: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
      toolchain: ${{ steps.toolchain.outputs.channel }}
      publish: ${{ steps.package.outputs.publish }}
      tag: ${{ steps.package.outputs.tag }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          if [[ ! "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rust toolchain must be one exact stable version"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install '${{ steps.toolchain.outputs.channel }}' --profile minimal
      - id: package
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -er '.packages[] | select(.name == "shoutx") | .version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_NAME" != "v$version" ]]; then
            echo "Tag does not match the Cargo package version"
            exit 1
          fi
          successful_ci=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$COMMIT_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI result" and .conclusion == "success")] | length')
          if [[ "$successful_ci" -lt 1 ]]; then
            echo "The tagged commit does not have a successful CI result"
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extension: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
      TARGET: ${{ matrix.target }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Install musl linker
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build locked release binary
        shell: bash
        run: cargo +"$TOOLCHAIN" build --release --locked --target "$TARGET"
      - name: Package and verify POSIX archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
          COPYFILE_DISABLE: "1"
        run: |
          root="shoutx-v${VERSION}-${TARGET}"
          archive="${root}.tar.gz"
          mkdir -p "dist/$root" verify
          install -m 0755 "target/$TARGET/release/shoutx" "dist/$root/shoutx"
          install -m 0644 README.md LICENSE "dist/$root/"
          "dist/$root/shoutx" --version
          tar -czf "dist/$archive" -C dist "$root"
          tar -xzf "dist/$archive" -C verify
          test "$(find "verify/$root" -type f | wc -l | tr -d ' ')" = 3
          test -x "verify/$root/shoutx"
          test -f "verify/$root/README.md"
          test -f "verify/$root/LICENSE"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            test "$(stat -c '%a' "verify/$root/shoutx")" = 755
            test "$(stat -c '%a' "verify/$root/README.md")" = 644
            test "$(stat -c '%a' "verify/$root/LICENSE")" = 644
          else
            test "$(stat -f '%Lp' "verify/$root/shoutx")" = 755
            test "$(stat -f '%Lp' "verify/$root/README.md")" = 644
            test "$(stat -f '%Lp' "verify/$root/LICENSE")" = 644
          fi
          "verify/$root/shoutx" --version
          rm -rf "dist/$root" verify
      - name: Package and verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "shoutx-v${env:VERSION}-${env:TARGET}"
          $archive = "$root.zip"
          New-Item -ItemType Directory -Force -Path "dist/$root", "verify" | Out-Null
          Copy-Item "target/$env:TARGET/release/shoutx.exe" "dist/$root/"
          Copy-Item README.md, LICENSE "dist/$root/"
          & "dist/$root/shoutx.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "dist/$root" -DestinationPath "dist/$archive"
          Expand-Archive "dist/$archive" -DestinationPath verify
          $files = Get-ChildItem -File "verify/$root"
          if ($files.Count -ne 3) { throw "Unexpected archive contents" }
          & "verify/$root/shoutx.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse "dist/$root", "verify"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ matrix.target }}
          path: dist/shoutx-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 2

  publish:
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    needs: [metadata, aggregate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.metadata.outputs.tag }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-dry-run
          path: dist
      - name: Reverify publication inputs
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Create or reset draft release
        shell: bash
        run: |
          set +e
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)
          found=$?
          set -e
          if [[ "$found" -eq 0 ]]; then
            if [[ "$(jq -r '.draft' <<< "$release")" != "true" ]]; then
              echo "A published release already exists for this tag"
              exit 1
            fi
            release_id=$(jq -r '.id' <<< "$release")
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
              --jq '.[].id' | while IFS= read -r asset_id; do
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done
          elif [[ "$found" -eq 1 ]]; then
            args=("$TAG" --draft --verify-tag --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          else
            exit "$found"
          fi
      - name: Upload and verify draft assets
        shell: bash
        run: |
          gh release upload "$TAG" dist/*
          mkdir downloaded
          gh release download "$TAG" --dir downloaded
          diff -u dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
          test "$(find downloaded -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
      - name: Publish verified release
        shell: bash
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

  aggregate:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - name: Verify complete artifact set and checksums
        shell: bash
        run: |
          expected=$(mktemp)
          actual=$(mktemp)
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            echo "shoutx-v${VERSION}-${target}.tar.gz"
          done > "$expected"
          echo "shoutx-v${VERSION}-x86_64-pc-windows-msvc.zip" >> "$expected"
          LC_ALL=C sort -o "$expected" "$expected"
          find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          (
            cd dist
            while IFS= read -r filename; do
              sha256sum -- "$filename"
            done < "$expected" > SHA256SUMS
          )
          (cd dist && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-dry-run
          path: dist/
          if-no-files-found: error
          retention-days: 2
