name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - .gitattributes
      - .github/scripts/install-shoutx.sh
      - .github/workflows/release.yml
      - scripts/verify-stable-docs.sh
      - tools/archive-validator/**
      - src/**
      - tests/fixtures/stable-help.txt
      - tests/cli_contract.rs
      - tests/stable_surface.rs
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          if [[ ! "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rust toolchain must be one exact stable version" >&2
            exit 1
          fi
          rustup toolchain install "$toolchain" --profile minimal \
            --component clippy --component rustfmt
          printf 'TOOLCHAIN=%s\n' "$toolchain" >> "$GITHUB_ENV"
      - name: Verify stable contract with release feature flags
        run: |
          scripts/verify-stable-docs.sh
          SHOUTX_EXPECT_SURFACE=stable CARGO_TARGET_DIR=target/release-gates \
            cargo +"$TOOLCHAIN" test --all-targets --locked --no-default-features
      - name: Verify exact Cargo feature table
        shell: bash
        run: |
          features=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -c '.packages[] | select(.name == "shoutx") | .features')
          test "$features" = '{"default":[],"unstable-github-actions-stdout":["dep:unicode-general-category"]}'
          cargo tree --locked --no-default-features -e normal > target/stable-tree.txt
          if grep -F 'unicode-general-category' target/stable-tree.txt; then
            echo "Stable dependency graph includes the unstable stdout dependency" >&2
            exit 1
          fi
          cargo tree --locked --features unstable-github-actions-stdout -e normal |
            grep -F 'unicode-general-category'
      - name: Verify release archive validator
        shell: bash
        run: |
          cargo +"$TOOLCHAIN" fmt \
            --manifest-path tools/archive-validator/Cargo.toml --all -- --check
          cargo +"$TOOLCHAIN" test --locked \
            --manifest-path tools/archive-validator/Cargo.toml
          cargo +"$TOOLCHAIN" clippy --all-targets --locked \
            --manifest-path tools/archive-validator/Cargo.toml -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          manifest-path: tools/archive-validator/Cargo.toml
          arguments: --config deny.toml --locked
          command-arguments: advisories bans licenses sources

  metadata:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.package.outputs.version }}
      toolchain: ${{ steps.toolchain.outputs.channel }}
      publish: ${{ steps.package.outputs.publish }}
      tag: ${{ steps.package.outputs.tag }}
      prerelease: ${{ steps.package.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned shoutx release
        id: setup-shoutx
        uses: send/setup-shoutx@eb61a2361c6c0e0d37ab9cca1c50e998b4a94c24 # v0.1.0
        with:
          shoutx-version: '0.3.0-rc.1'
          checksums-sha256: b280ecb4122b02c0961638c0eb84bae6932af55193c3ea9ae2aa2b02ef8afa99
          github-token: ${{ github.token }}
      - name: Verify installed release and subsequent-step PATH
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.setup-shoutx.outputs.version }}
        run: |
          test "$INSTALLED_VERSION" = '0.3.0-rc.1'
          test "$(shoutx --version)" = "shoutx $INSTALLED_VERSION"
      - id: toolchain
        shell: bash
        run: |
          shoutx=$(command -v shoutx)
          channel=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          if [[ ! "$channel" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Rust toolchain must be one exact stable version"
            exit 1
          fi
          "$shoutx" github-actions:output channel "$channel" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install '${{ steps.toolchain.outputs.channel }}' --profile minimal
      - id: package
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          shoutx=$(command -v shoutx)
          version=$(cargo metadata --format-version 1 --no-deps --locked |
            jq -er '.packages[] | select(.name == "shoutx") | .version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release version"
            exit 1
          fi
          if [[ ${#version} -gt 55 ]]; then
            echo "Release version exceeds the revision-1 archive path limit"
            exit 1
          fi
          "$shoutx" github-actions:output version "$version" >> "$GITHUB_OUTPUT"
          "$shoutx" github-actions:output tag "v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            "$shoutx" github-actions:output prerelease true >> "$GITHUB_OUTPUT"
          else
            "$shoutx" github-actions:output prerelease false >> "$GITHUB_OUTPUT"
          fi

          if [[ "$EVENT_NAME" != "push" ]]; then
            "$shoutx" github-actions:output publish false >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$REF_NAME" != "v$version" ]]; then
            echo "Tag does not match the Cargo package version"
            exit 1
          fi
          latest_ci=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$COMMIT_SHA" -f event=push -f per_page=1)
          if [[ "$(jq -r '.workflow_runs | length' <<< "$latest_ci")" != 1 ]] ||
             [[ "$(jq -r '.workflow_runs[0].status' <<< "$latest_ci")" != "completed" ]] ||
             [[ "$(jq -r '.workflow_runs[0].conclusion' <<< "$latest_ci")" != "success" ]]; then
            echo "The latest CI workflow run for the tagged commit is not successful"
            exit 1
          fi
          "$shoutx" github-actions:output publish true >> "$GITHUB_OUTPUT"

  build:
    needs: [metadata, release-gates]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            extension: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
      TARGET: ${{ matrix.target }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
      - name: Install musl linker
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build locked release binary
        shell: bash
        run: |
          CARGO_TARGET_DIR=target/release-stable cargo +"$TOOLCHAIN" build \
            --release --locked --no-default-features --target "$TARGET"
          CARGO_TARGET_DIR=target/release-unstable cargo +"$TOOLCHAIN" build \
            --release --locked --features unstable-github-actions-stdout --target "$TARGET"
      - name: Verify stable and unstable artifact identities
        shell: bash
        run: |
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          stable="target/release-stable/$TARGET/release/shoutx$suffix"
          unstable="target/release-unstable/$TARGET/release/shoutx$suffix"
          test "$($stable --version)" = "shoutx $VERSION"
          test "$($unstable --version)" = "shoutx $VERSION (unstable-github-actions-stdout)"
          SHOUTX_EXPECT_SURFACE=stable CARGO_TARGET_DIR=target/release-stable \
            cargo +"$TOOLCHAIN" test --release --locked --no-default-features \
              --target "$TARGET" --test cli_contract
          SHOUTX_VERIFY_BINARY="$stable" SHOUTX_VERIFY_REQUIRE_EXTERNAL=1 \
            SHOUTX_EXPECT_SURFACE=stable \
            CARGO_TARGET_DIR=target/verifier-stable \
            cargo +"$TOOLCHAIN" test --locked --no-default-features --test stable_surface
          SHOUTX_VERIFY_BINARY="$unstable" SHOUTX_VERIFY_REQUIRE_EXTERNAL=1 \
            SHOUTX_EXPECT_SURFACE=unstable \
            CARGO_TARGET_DIR=target/verifier-unstable \
            cargo +"$TOOLCHAIN" test --locked --features unstable-github-actions-stdout --test stable_surface
          cargo tree --locked --no-default-features --target "$TARGET" -e normal > target/stable-target-tree.txt
          if grep -F 'unicode-general-category' target/stable-target-tree.txt; then
            echo "Stable target dependency graph includes the unstable stdout dependency" >&2
            exit 1
          fi
          cargo tree --locked --features unstable-github-actions-stdout --target "$TARGET" -e normal |
            grep -F 'unicode-general-category'
      - name: Package and verify POSIX archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          LC_ALL: C
          TZ: UTC
          COPYFILE_DISABLE: "1"
        run: |
          root="shoutx-v${VERSION}-${TARGET}"
          archive="${root}.tar.gz"
          mkdir -p "dist/$root" verify
          install -m 0755 "target/release-stable/$TARGET/release/shoutx" "dist/$root/shoutx"
          install -m 0644 README.md LICENSE "dist/$root/"
          tar -czf "dist/$archive" -C dist "$root"
          tar -xzf "dist/$archive" -C verify
          test "$(find "verify/$root" -type f | wc -l | tr -d ' ')" = 3
          test -x "verify/$root/shoutx"
          test -f "verify/$root/README.md"
          test -f "verify/$root/LICENSE"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            test "$(stat -c '%a' "verify/$root/shoutx")" = 755
            test "$(stat -c '%a' "verify/$root/README.md")" = 644
            test "$(stat -c '%a' "verify/$root/LICENSE")" = 644
          else
            test "$(stat -f '%Lp' "verify/$root/shoutx")" = 755
            test "$(stat -f '%Lp' "verify/$root/README.md")" = 644
            test "$(stat -f '%Lp' "verify/$root/LICENSE")" = 644
          fi
          SHOUTX_VERIFY_BINARY="$GITHUB_WORKSPACE/verify/$root/shoutx" \
            SHOUTX_VERIFY_REQUIRE_EXTERNAL=1 \
            SHOUTX_EXPECT_SURFACE=stable \
            CARGO_TARGET_DIR=target/verifier-extracted \
            cargo +"$TOOLCHAIN" test --locked --no-default-features --test stable_surface
          rm -rf "dist/$root" verify
      - name: Package and verify Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "shoutx-v${env:VERSION}-${env:TARGET}"
          $archive = "$root.zip"
          New-Item -ItemType Directory -Force -Path "dist/$root", "verify" | Out-Null
          Copy-Item "target/release-stable/$env:TARGET/release/shoutx.exe" "dist/$root/"
          Copy-Item README.md, LICENSE "dist/$root/"
          Compress-Archive -Path "dist/$root" -DestinationPath "dist/$archive"
          Expand-Archive "dist/$archive" -DestinationPath verify
          $files = Get-ChildItem -File "verify/$root"
          if ($files.Count -ne 3) { throw "Unexpected archive contents" }
          $env:SHOUTX_VERIFY_BINARY = "$pwd/verify/$root/shoutx.exe"
          $env:SHOUTX_VERIFY_REQUIRE_EXTERNAL = '1'
          $env:SHOUTX_EXPECT_SURFACE = 'stable'
          $env:CARGO_TARGET_DIR = 'target/verifier-extracted'
          cargo "+$env:TOOLCHAIN" test --locked --no-default-features --test stable_surface
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse "dist/$root", "verify"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ matrix.target }}
          path: dist/shoutx-v${{ needs.metadata.outputs.version }}-${{ matrix.target }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 2

  publish:
    if: ${{ needs.metadata.outputs.publish == 'true' }}
    needs: [metadata, aggregate]
    concurrency:
      group: release-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.metadata.outputs.tag }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: dist
      - name: Reverify publication inputs
        shell: bash
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*
      - name: Create or reset draft release
        shell: bash
        run: |
          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          tag_type=$(jq -r '.object.type' <<< "$tag_object")
          tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
          for _ in {1..8}; do
            [[ "$tag_type" == "tag" ]] || break
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
            tag_type=$(jq -r '.object.type' <<< "$tag_object")
            tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The release tag no longer resolves to the triggering commit"
            exit 1
          fi

          set +e
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)
          found=$?
          set -e
          if [[ "$found" -eq 0 ]]; then
            if [[ "$(jq -r '.draft' <<< "$release")" != "true" ]]; then
              echo "A published release already exists for this tag"
              exit 1
            fi
            release_id=$(jq -r '.id' <<< "$release")
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
              --jq '.[].id' | while IFS= read -r asset_id; do
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done
          elif [[ "$found" -eq 1 ]]; then
            args=("$TAG" --draft --verify-tag --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          else
            exit "$found"
          fi
      - name: Upload and verify draft assets
        shell: bash
        run: |
          gh release upload "$TAG" dist/*
          mkdir downloaded
          gh release download "$TAG" --dir downloaded
          diff -u dist/SHA256SUMS downloaded/SHA256SUMS
          (cd downloaded && sha256sum --check SHA256SUMS)
          test "$(find downloaded -maxdepth 1 -type f | wc -l | tr -d ' ')" = 6
      - name: Publish verified release
        shell: bash
        run: |
          latest_ci=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f per_page=1)
          if [[ "$(jq -r '.workflow_runs | length' <<< "$latest_ci")" != 1 ]] ||
             [[ "$(jq -r '.workflow_runs[0].status' <<< "$latest_ci")" != "completed" ]] ||
             [[ "$(jq -r '.workflow_runs[0].conclusion' <<< "$latest_ci")" != "success" ]]; then
            echo "The latest CI workflow run for the tagged commit is not successful"
            exit 1
          fi

          tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          tag_type=$(jq -r '.object.type' <<< "$tag_object")
          tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
          for _ in {1..8}; do
            [[ "$tag_type" == "tag" ]] || break
            tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")
            tag_type=$(jq -r '.object.type' <<< "$tag_object")
            tag_sha=$(jq -r '.object.sha' <<< "$tag_object")
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "The release tag no longer resolves to the triggering commit"
            exit 1
          fi

          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            latest_file=$(mktemp)
            set +e
            latest_status=$(curl --silent --show-error \
              --output "$latest_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")
            curl_status=$?
            set -e
            if [[ "$curl_status" -ne 0 ]]; then
              exit "$curl_status"
            elif [[ "$latest_status" == "200" ]]; then
              current_latest=$(jq -er '.tag_name' "$latest_file")
            elif [[ "$latest_status" == "404" ]]; then
              current_latest=""
            else
              echo "Latest release lookup failed with HTTP $latest_status"
              exit 1
            fi
            if [[ "$current_latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              greatest=$(printf '%s\n%s\n' "$current_latest" "$TAG" |
                LC_ALL=C sort -V | tail -n 1)
              if [[ "$greatest" != "$TAG" ]]; then
                echo "Refusing to move the latest release pointer backward"
                exit 1
              fi
            elif [[ -n "$current_latest" ]]; then
              echo "Current latest release has an unsupported tag"
              exit 1
            fi
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          if [[ "$(jq -r '.immutable' <<< "$release")" != "true" ]]; then
            echo "Published release is not immutable; this version is ineligible"
            exit 1
          fi

  aggregate:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.metadata.outputs.version }}
      TOOLCHAIN: ${{ needs.metadata.outputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: candidate-*
          path: ${{ runner.temp }}/release-candidates
          merge-multiple: true
      - name: Verify complete artifact set and checksums
        shell: bash
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          candidate_dir="$RUNNER_TEMP/release-candidates"
          expected=$(mktemp)
          actual=$(mktemp)
          for target in \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            echo "shoutx-v${VERSION}-${target}.tar.gz"
          done > "$expected"
          echo "shoutx-v${VERSION}-x86_64-pc-windows-msvc.zip" >> "$expected"
          LC_ALL=C sort -o "$expected" "$expected"
          find "$candidate_dir" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          validated=0
          while IFS= read -r filename; do
            root=${filename%.tar.gz}
            root=${root%.zip}
            echo "Validating $filename"
            cargo +"$TOOLCHAIN" run --quiet --locked \
              --manifest-path tools/archive-validator/Cargo.toml -- \
              "$candidate_dir/$filename" "$root" </dev/null
            validated=$((validated + 1))
          done < "$expected"
          test "$validated" -eq 5
          (
            cd "$candidate_dir"
            while IFS= read -r filename; do
              sha256sum -- "$filename"
            done < "$expected" > SHA256SUMS
          )
          (cd "$candidate_dir" && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-candidates/
          if-no-files-found: error
          retention-days: 2
