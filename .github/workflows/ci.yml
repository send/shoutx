name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --all-targets
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable build
      - name: POSIX shell smoke tests
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh tests/workflow-smoke/posix.sh target/debug/shoutx sh
          bash tests/workflow-smoke/posix.sh target/debug/shoutx bash
      - name: PowerShell smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/workflow-smoke/windows.ps1 -Binary target/debug/shoutx.exe
      - name: Invalid Windows standard handles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c `
            "`"$devcmd`" -no_logo -arch=x64 && cl.exe /nologo /W4 /WX tests\workflow-smoke\windows_invalid_handle.c /Fe:target\windows_invalid_handle.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/windows_invalid_handle.exe `
            (Resolve-Path target/debug/shoutx.exe)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Git Bash smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHOUTX_BIN: ${{ github.workspace }}\target\debug\shoutx.exe
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc `
            'tests/workflow-smoke/posix.sh "$(cygpath -u "$SHOUTX_BIN")" bash'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  msrv:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 test --all-targets
      - run: cargo +1.85.0 clippy --all-targets -- -D warnings

  runner-differential:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/runner
          ref: 397b032cbf865e9c3ddfab89d533ec19325e1273
          path: target/runner-oracle/actions-runner
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.424
      - name: Verify pinned .NET SDK
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          if ((dotnet --version) -ne '8.0.424') {
            throw "Expected .NET SDK 8.0.424, got $(dotnet --version)"
          }
      - run: rustup toolchain install stable --profile minimal
      - name: Generate and validate shared corpus
        shell: pwsh
        run: |
          cargo +stable test --test runner_differential_fixture local_model_matches_shared_runner_corpus
          cargo +stable test --test path_runner_fixture local_path_model_matches_shared_corpus
          $env:SHOUTX_CORPUS_PATH = "$pwd/target/runner-oracle/corpus.json"
          cargo +stable test --test runner_differential_fixture export_runner_corpus -- --ignored
          $env:SHOUTX_PATH_CORPUS_PATH = "$pwd/target/runner-oracle/path-corpus.json"
          cargo +stable test --test path_runner_fixture export_path_corpus -- --ignored
      - name: Build pinned runner oracle
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          Copy-Item ${{ github.workspace }}/tests/runner-oracle/ShoutxDifferentialL0.cs Test/L0/Worker/
          dotnet build Test/Test.csproj `
            --configuration Release `
            -p:PackageRuntime=${{ matrix.runtime }} `
            -p:NuGetAudit=false
      - name: Compare pinned runner parser
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        env:
          SHOUTX_CORPUS: ${{ github.workspace }}/target/runner-oracle/corpus.json
          SHOUTX_PATH_CORPUS: ${{ github.workspace }}/target/runner-oracle/path-corpus.json
        run: |
          dotnet test Test/Test.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter 'FullyQualifiedName~ShoutxDifferentialL0'
