[package]
name = "shoutx"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Safe writers for CI workflow output boundaries"
repository = "https://github.com/send/shoutx"

[dependencies]
getrandom = "0.4.3"
unicode-general-category = "1.1.0"

[dev-dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.release]
overflow-checks = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
