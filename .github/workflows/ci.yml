name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned shoutx release
        shell: bash
        run: .github/scripts/install-shoutx.sh
      - name: Detect non-documentation changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          shoutx="$RUNNER_TEMP/shoutx-bootstrap/bin/shoutx"
          if [[ "$EVENT_NAME" == "push" && "$BASE_SHA" =~ ^0+$ ]]; then
            "$shoutx" github-actions:output run_ci true >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA...$HEAD_SHA"
          else
            range="$BASE_SHA..$HEAD_SHA"
          fi

          set +e
          git diff --quiet "$range" -- . \
            ':(exclude)AGENTS.md' \
            ':(exclude)README.md' \
            ':(exclude)SECURITY.md' \
            ':(exclude)docs/**'
          status=$?
          set -e

          case "$status" in
            0) "$shoutx" github-actions:output run_ci false >> "$GITHUB_OUTPUT" ;;
            1) "$shoutx" github-actions:output run_ci true >> "$GITHUB_OUTPUT" ;;
            *)
              echo "Change detection failed with status $status; running full CI"
              "$shoutx" github-actions:output run_ci true >> "$GITHUB_OUTPUT"
              ;;
          esac

  dependencies:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources

  test:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --all-targets
      - run: cargo +stable clippy --all-targets -- -D warnings
      - run: cargo +stable build
      - name: Dogfood GitHub action state
        uses: ./tests/workflow-state-action
        with:
          binary: ${{ github.workspace }}/target/debug/shoutx
      - name: Verify state is not a step environment export
        shell: bash
        run: test -z "${STATE_Result+x}"
      - name: Dogfood GitHub environment files on POSIX
        id: dogfood_posix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dogfood_path="$RUNNER_TEMP/shoutx-dogfood-bin"
          mkdir -p "$dogfood_path"
          target/debug/shoutx github-actions:output value 'output % 日本語' >> "$GITHUB_OUTPUT"
          target/debug/shoutx github-actions:output --multiline multiline $'first\nsecond\n' >> "$GITHUB_OUTPUT"
          target/debug/shoutx github-actions:env SHOUTX_DOGFOOD_ENV 'env % 日本語' >> "$GITHUB_ENV"
          target/debug/shoutx github-actions:path "$dogfood_path" >> "$GITHUB_PATH"
          mask_marker="shoutx-mask-$(uuidgen)"
          printf %s "$mask_marker" | target/debug/shoutx github-actions:mask
          target/debug/shoutx github-actions:output masked_value "$mask_marker" >> "$GITHUB_OUTPUT"
          printf 'masked value: %s\n' "$mask_marker"
      - name: Verify dogfooded values on POSIX
        if: runner.os != 'Windows'
        shell: bash
        env:
          DOGFOOD_OUTPUT: ${{ steps.dogfood_posix.outputs.value }}
          DOGFOOD_MULTILINE: ${{ steps.dogfood_posix.outputs.multiline }}
          DOGFOOD_MASKED: ${{ steps.dogfood_posix.outputs.masked_value }}
        run: |
          [[ "$DOGFOOD_OUTPUT" == 'output % 日本語' ]]
          [[ "$DOGFOOD_MULTILINE" == $'first\nsecond\n' ]]
          [[ "$SHOUTX_DOGFOOD_ENV" == 'env % 日本語' ]]
          [[ "$DOGFOOD_MASKED" == shoutx-mask-* ]]
          [[ ":$PATH:" == *":$RUNNER_TEMP/shoutx-dogfood-bin:"* ]]
      - name: Dogfood GitHub environment files on Windows
        id: dogfood_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dogfoodPath = Join-Path $env:RUNNER_TEMP 'shoutx-dogfood-bin'
          New-Item -ItemType Directory -Force $dogfoodPath | Out-Null
          target/debug/shoutx.exe github-actions:output value 'output % 日本語' >> $env:GITHUB_OUTPUT
          target/debug/shoutx.exe github-actions:output --multiline multiline "first`nsecond`n" >> $env:GITHUB_OUTPUT
          target/debug/shoutx.exe github-actions:env SHOUTX_DOGFOOD_ENV 'env % 日本語' >> $env:GITHUB_ENV
          target/debug/shoutx.exe github-actions:path $dogfoodPath >> $env:GITHUB_PATH
          $maskMarker = "shoutx-mask-$([guid]::NewGuid())"
          $maskMarker | target/debug/shoutx.exe github-actions:mask
          target/debug/shoutx.exe github-actions:output masked_value $maskMarker >> $env:GITHUB_OUTPUT
          Write-Output "masked value: $maskMarker"
      - name: Verify dogfooded values on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOGFOOD_OUTPUT: ${{ steps.dogfood_windows.outputs.value }}
          DOGFOOD_MULTILINE: ${{ steps.dogfood_windows.outputs.multiline }}
          DOGFOOD_MASKED: ${{ steps.dogfood_windows.outputs.masked_value }}
        run: |
          if ($env:DOGFOOD_OUTPUT -cne 'output % 日本語') { throw 'Output mismatch' }
          if ($env:DOGFOOD_MULTILINE -cne "first`nsecond`n") { throw 'Multiline mismatch' }
          if ($env:SHOUTX_DOGFOOD_ENV -cne 'env % 日本語') { throw 'Environment mismatch' }
          if (-not $env:DOGFOOD_MASKED.StartsWith('shoutx-mask-')) { throw 'Masked step output mismatch' }
          $expectedPath = Join-Path $env:RUNNER_TEMP 'shoutx-dogfood-bin'
          if ($expectedPath -notin ($env:PATH -split ';')) { throw 'PATH mismatch' }
      - name: POSIX shell smoke tests
        if: runner.os != 'Windows'
        shell: sh
        run: |
          sh tests/workflow-smoke/posix.sh target/debug/shoutx sh
          bash tests/workflow-smoke/posix.sh target/debug/shoutx bash
      - name: Dash smoke tests
        id: dash_smoke
        if: runner.os == 'Linux'
        shell: dash -e {0}
        run: |
          command -v dash
          dpkg-query --show --showformat='dash ${Version}\n' dash
          dash tests/workflow-smoke/posix.sh target/debug/shoutx dash
          target/debug/shoutx github-actions:output value 'dash % 日本語' >> "$GITHUB_OUTPUT"
      - name: Verify Dash workflow output
        if: runner.os == 'Linux'
        shell: dash -e {0}
        env:
          DASH_OUTPUT: ${{ steps.dash_smoke.outputs.value }}
        run: test "$DASH_OUTPUT" = 'dash % 日本語'
      - name: PowerShell smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/workflow-smoke/windows.ps1 -Binary target/debug/shoutx.exe
      - name: Invalid Windows standard handles
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $devcmd = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          & cmd.exe /d /s /c `
            "`"$devcmd`" -no_logo -arch=x64 && cl.exe /nologo /W4 /WX tests\workflow-smoke\windows_invalid_handle.c /Fe:target\windows_invalid_handle.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          target/windows_invalid_handle.exe `
            (Resolve-Path target/debug/shoutx.exe)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Git Bash smoke tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SHOUTX_BIN: ${{ github.workspace }}\target\debug\shoutx.exe
        run: |
          & "$env:ProgramFiles\Git\bin\bash.exe" -lc `
            'tests/workflow-smoke/posix.sh "$(cygpath -u "$SHOUTX_BIN")" bash'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  msrv:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 test --all-targets
      - run: cargo +1.85.0 clippy --all-targets -- -D warnings

  runner-differential:
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
          - os: windows-latest
            runtime: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: actions/runner
          ref: 397b032cbf865e9c3ddfab89d533ec19325e1273
          path: target/runner-oracle/actions-runner
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 8.0.424
      - name: Verify pinned .NET SDK
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          if ((dotnet --version) -ne '8.0.424') {
            throw "Expected .NET SDK 8.0.424, got $(dotnet --version)"
          }
      - run: rustup toolchain install stable --profile minimal
      - name: Generate and validate shared corpus
        shell: pwsh
        run: |
          cargo +stable test --test runner_differential_fixture local_model_matches_shared_runner_corpus
          cargo +stable test --test path_runner_fixture local_path_model_matches_shared_corpus
          cargo +stable test --test mask_runner_fixture generated_commands_have_one_physical_line
          $env:SHOUTX_CORPUS_PATH = "$pwd/target/runner-oracle/corpus.json"
          cargo +stable test --test runner_differential_fixture export_runner_corpus -- --ignored
          $env:SHOUTX_PATH_CORPUS_PATH = "$pwd/target/runner-oracle/path-corpus.json"
          cargo +stable test --test path_runner_fixture export_path_corpus -- --ignored
          $env:SHOUTX_MASK_CORPUS_PATH = "$pwd/target/runner-oracle/mask-corpus.json"
          cargo +stable test --test mask_runner_fixture export_mask_corpus -- --ignored
      - name: Build pinned runner oracle
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        run: |
          Copy-Item ${{ github.workspace }}/tests/runner-oracle/ShoutxDifferentialL0.cs Test/L0/Worker/
          dotnet build Test/Test.csproj `
            --configuration Release `
            -p:PackageRuntime=${{ matrix.runtime }} `
            -p:NuGetAudit=false
      - name: Compare pinned runner parser
        shell: pwsh
        working-directory: target/runner-oracle/actions-runner/src
        env:
          SHOUTX_CORPUS: ${{ github.workspace }}/target/runner-oracle/corpus.json
          SHOUTX_PATH_CORPUS: ${{ github.workspace }}/target/runner-oracle/path-corpus.json
          SHOUTX_MASK_CORPUS: ${{ github.workspace }}/target/runner-oracle/mask-corpus.json
        run: |
          dotnet test Test/Test.csproj `
            --configuration Release `
            --no-build `
            --no-restore `
            --filter 'FullyQualifiedName~ShoutxDifferentialL0'

  # The main-branch ruleset requires this stable aggregate check rather than
  # individual matrix checks.
  ci-result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, dependencies, test, msrv, runner-differential]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Verify required job results
        shell: bash
        env:
          RUN_CI: ${{ needs.changes.outputs.run_ci }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependencies.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          RUNNER_DIFFERENTIAL_RESULT: ${{ needs.runner-differential.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed"
            exit 1
          fi

          if [[ "$RUN_CI" == "true" ]]; then
            expected="success"
          elif [[ "$RUN_CI" == "false" ]]; then
            expected="skipped"
          else
            echo "Change detection produced an invalid result"
            exit 1
          fi

          for result in \
            "$DEPENDENCIES_RESULT" \
            "$TEST_RESULT" \
            "$MSRV_RESULT" \
            "$RUNNER_DIFFERENTIAL_RESULT"
          do
            if [[ "$result" != "$expected" ]]; then
              echo "Expected dependent jobs to be $expected, got $result"
              exit 1
            fi
          done
