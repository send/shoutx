name: Workflow artifact availability probe

on:
  pull_request:
    paths:
      - .github/workflows/artifacts-availability-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Declare known file subject
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:GITHUB_ARTIFACTS)) {
            throw 'GITHUB_ARTIFACTS is absent'
          }
          $path = Join-Path $env:GITHUB_WORKSPACE "shoutx-artifacts-probe-$env:RUNNER_OS.txt"
          [IO.File]::WriteAllText($path, "shoutx artifacts probe`n", [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText(
            $env:GITHUB_ARTIFACTS,
            "file://$path`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Verify job-scoped artifact list
        shell: pwsh
        run: |
          if ([string]::IsNullOrEmpty($env:GITHUB_ARTIFACTS_LIST)) {
            throw 'GITHUB_ARTIFACTS_LIST is absent'
          }
          $list = Get-Item -LiteralPath $env:GITHUB_ARTIFACTS_LIST
          if ($list.Length -eq 0) {
            throw 'GITHUB_ARTIFACTS_LIST is empty; artifact processing is disabled'
          }

          $payload = Get-Content -LiteralPath $list.FullName -Raw | ConvertFrom-Json
          $path = Join-Path $env:GITHUB_WORKSPACE "shoutx-artifacts-probe-$env:RUNNER_OS.txt"
          $expectedDigest = "sha256:$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant())"
          $expectedName = Split-Path -Leaf $path

          if ($payload.version -ne 1) { throw "Unexpected format version: $($payload.version)" }
          if (@($payload.subjects).Count -ne 1) {
            throw "Expected one subject, got $(@($payload.subjects).Count)"
          }
          $subject = @($payload.subjects)[0]
          if ($subject.name -cne $expectedName) {
            throw "Unexpected subject name: $($subject.name)"
          }
          if ($subject.kind -cne 'file') {
            throw "Unexpected subject kind: $($subject.kind)"
          }
          if ($subject.digest -cne $expectedDigest) {
            throw "Unexpected subject digest: $($subject.digest)"
          }
