name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install stable --profile minimal --component clippy
      - run: cargo +stable test --all-targets
      - run: cargo +stable clippy --all-targets -- -D warnings

  msrv:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.85.0 fmt --all -- --check
      - run: cargo +1.85.0 test --all-targets
      - run: cargo +1.85.0 clippy --all-targets -- -D warnings
