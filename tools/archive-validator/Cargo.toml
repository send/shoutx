[package]
name = "shoutx-archive-validator"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
flate2 = { version = "1.1.2", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
crc32fast = "1.5.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "warn"
